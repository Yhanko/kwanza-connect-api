# ==============================================================================
# KwanzaConnect API — Configuração Nginx com WAF e Mitigação DDoS (Sandbox BNA)
# ==============================================================================

# Definição do cluster upstream
upstream django_backend {
    server web:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Zonas de Limitação de Taxa de Requisições (Rate Limiting)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn_limit:10m;

# Mapeamento e Bloqueio de Scanners de Vulnerabilidades e Bots Maliciosos
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(sqlmap|nikto|wpscan|havij|acunetix|nessus|masscan|zgrab|nmap|dirbuster|gobuster) 1;
}

server {
    listen 80;
    server_name _;

    # Oculta versão do Nginx
    server_tokens off;

    # Limite máximo de upload para imagens de KYC e documentos
    client_max_body_size 15M;

    # Mitigação de Ataques Slowloris e Timeouts Estritos
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Limite de conexões simultâneas por IP
    limit_conn per_ip_conn_limit 25;

    # Bloqueio imediato de bots maliciosos
    if ($is_malicious_bot = 1) {
        return 403;
    }

    # Bloqueio de Métodos HTTP Inseguros
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 405;
    }

    # Cabeçalhos de Segurança na Borda (Defense-in-Depth)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # ── Arquivos Estáticos ───────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Arquivos de Media (Documentos KYC / Avatares) ─────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "private, no-transform";
    }

    # ── Health Check (Sem Limitação de Taxa) ──────────────────────────────────
    location /api/health/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Endpoints de Autenticação e 2FA (Rate Limit Estrito: 5r/s) ────────────
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket — Chat P2P e Notificações em Tempo Real ────────────────────
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API REST Geral (Rate Limit: 30r/s) ───────────────────────────────────
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}